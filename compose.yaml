services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mush
      POSTGRES_PASSWORD: mush
      POSTGRES_DB: mush
    ports:
      - "5432:5432"
    volumes:
      - mush-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mush -d mush"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mush-db:
